<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b1e"/>
      <stop offset="1" stop-color="#1e1065"/>
    </linearGradient>
  </defs>
  <!-- GA monogram: same look as .brand-mark in the header -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#a5b4fc" stroke-opacity="0.25" stroke-width="2"/>
  <text x="32.5" y="43" text-anchor="end" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="800" fill="#ffffff">G</text>
  <text x="31.5" y="43" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="800" fill="#2dd4bf">A</text>
</svg>
